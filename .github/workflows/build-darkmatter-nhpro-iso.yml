name: Build DarkMatter + NetHunter Pro install ISO

# Takes the kernel produced by build-darkmatter-x86_64-nhpro.yml and fuses it
# with the DarkMatter android-x86 base and the Kali NetHunter rootfs into a
# single bootable install ISO.
#
# Inputs fetched here, not stored in the repo:
#   - base ISO      archive.org dark-matter-exo-4.7 (1.27 GB)
#   - Kali rootfs   kali.download nethunter-images (2.36 GB)
#   - kernel        the darkmatter-nhpro-x86_64 artifact from the kernel build
#
# Everything else (the fuse logic, the config, the pins) comes from the repo,
# so the image is reproducible from this workflow alone.
#
# Disk: the peak is roughly
#   base ISO 1.3 + unpacked tree 1.1 + rootfs 2.4 + sysroot ~4 + new image ~4
# which does not fit on a stock runner (14 GB free).  A free-disk step runs
# first and the job fails loudly on low space rather than dying mid-repack.

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Run ID of the kernel build to take vmlinuz/modules from (blank = latest successful)'
        type: string
        required: false
        default: ''
      fuse_rootfs:
        description: 'Fuse the Kali NetHunter rootfs into the image'
        type: boolean
        default: true
      fuse_apks:
        description: 'Install the NetHunter/NetHunterKeX APKs into /system/priv-app'
        type: boolean
        default: true
  push:
    branches: [015stray91]
    paths:
      - '.github/workflows/build-darkmatter-nhpro-iso.yml'
      - 'fuse_darkmatter_nh.sh'
      - 'unpack_system.sh'

permissions:
  contents: read
  actions: read

env:
  BASE_ISO_ID: dark-matter-exo-4.7
  BASE_ISO_FILE: DarkMatter_Exo4.7.iso
  # One zip holds both the NetHunter APKs and the Kali rootfs, and its rootfs
  # member is byte-identical to the standalone one, so this replaces two
  # downloads with one.
  NH_ZIP: https://kali.download/nethunter-images/current/kali-nethunter-2026.3-generic-amd64-full.zip
  # Everything lands here.  maximize-build-space moves the workspace onto the
  # large volume and shrinks / on purpose, so writing to /tmp runs out of room:
  # the artifact download died with "no space left on device" at ~2 GB.
  WORK: ${{ github.workspace }}/build

jobs:
  iso:
    name: Fuse ISO (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # Stock runners have ~14 GB free; the peak here is well past that.
      - name: Maximise build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Report disk and pick a work volume
        run: |
          set -euo pipefail
          df -h /
          mkdir -p "$WORK"
          # Put every scratch file on the big volume too.  gh run download
          # writes its zip to $TMPDIR, which defaults to the shrunken root --
          # that is what produced "no space left on device" on the first run.
          echo "TMPDIR=$WORK/tmp" >> "$GITHUB_ENV"
          mkdir -p "$WORK/tmp"
          avail=$(df -B1 --output=avail "$WORK" | tail -1 | tr -d ' ')
          echo "work volume free: $(numfmt --to=iec "$avail")"
          # 2 GB kernel artifact + 1.3 GB ISO + 2.5 GB zip + ~9 GB of working
          # copies.  Fail now rather than halfway through a repack.
          if [ "$avail" -lt $((12 * 1024 * 1024 * 1024)) ]; then
            echo "::error::only $(numfmt --to=iec "$avail") on the work volume; need 12G"
            exit 1
          fi

      - name: Checkout Super-Builders
        uses: actions/checkout@v7
        with:
          path: sb

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            squashfs-tools xorriso rsync curl xz-utils e2fsprogs \
            android-sdk-libsparse-utils cpio
          for c in unsquashfs mksquashfs xorriso mke2fs debugfs simg2img; do
            command -v "$c" >/dev/null || { echo "missing $c" >&2; exit 1; }
          done

      - name: Fetch the kernel build
        id: kern
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.kernel_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/build-darkmatter-x86_64-nhpro.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] \
              || { echo "no successful kernel run found" >&2; exit 1; }
          fi
          echo "kernel run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          mkdir -p $WORK/kern
          gh run download "$RUN_ID" -R "${{ github.repository }}" \
            -n darkmatter-nhpro-x86_64 -D $WORK/kern
          find $WORK/kern -maxdepth 3 \( -name vmlinuz -o -name System.map \) -print

      - name: Normalise the kernel payload
        run: |
          set -euo pipefail
          # The artifact nests things a couple of levels deep (boot/, out/).
          V=$(find $WORK/kern -name vmlinuz -type f -print -quit)
          [ -n "$V" ] || { echo "no vmlinuz in artifact" >&2; exit 1; }
          mkdir -p $WORK/kdir
          cp "$V" $WORK/kdir/vmlinuz
          M=$(find $WORK/kern -type d -path '*lib/modules/*' -name '6.12*' -print -quit)
          if [ -n "$M" ]; then
            mkdir -p $WORK/kdir/modules/lib/modules
            cp -a "$M" $WORK/kdir/modules/lib/modules/
          else
            echo "::warning::no 6.12 module tree in the artifact -- modules will not load"
          fi
          file $WORK/kdir/vmlinuz
          echo "modules: $(find $WORK/kdir/modules -name '*.ko*' 2>/dev/null | wc -l)"
          # Kernel config sanity: squashfs must be built in, or the image cannot
          # be mounted at boot (this is the bug that made the first build boot
          # to a black screen).
          # config or config.gz -- the artifact carries one of them.
          C=$(find $WORK/kern -name 'config*' -type f -print -quit)
          if [ -n "$C" ]; then
            case "$C" in
              *.gz) CFG=$(mktemp "$WORK/cfg.XXXXXX"); gzip -dc "$C" > "$CFG" ;;
              *)    CFG="$C" ;;
            esac
            for o in CONFIG_SQUASHFS CONFIG_BLK_DEV_LOOP CONFIG_EXT4_FS \
                     CONFIG_SQUASHFS_XZ CONFIG_BLK_DEV_INITRD CONFIG_RD_GZIP; do
              grep -q "^$o=y" "$CFG" \
                || { echo "::error::$o is not =y -- the kernel cannot mount the system image"; exit 1; }
            done
            echo "kernel config: squashfs/loop/ext4/initrd built in"
          else
            echo "::warning::no kernel config in the artifact; skipped the squashfs check"
          fi

      - name: Fetch the DarkMatter base ISO
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o $WORK/base.iso \
            "https://archive.org/download/${BASE_ISO_ID}/${BASE_ISO_FILE}"
          ls -l $WORK/base.iso
          file $WORK/base.iso | grep -q ISO || { echo "not an ISO image" >&2; exit 1; }

      - name: Check the base ISO has what we need
        run: |
          set -euo pipefail
          # The fuse script extracts the ISO itself; just prove the boot
          # images are present so a bad download fails here, not mid-repack.
          #
          # xorriso exits 0 even for a missing path, and its -exec lsdl column
          # layout shifts with the date, so parsing it is fragile.  Extract the
          # two files and stat them instead -- unambiguous.
          mkdir -p $WORK/probe
          for f in isolinux/isolinux.bin boot/grub/efi.img; do
            rm -f "$WORK/probe/${f##*/}"
            xorriso -osirrox on -indev $WORK/base.iso \
              -extract "/$f" "$WORK/probe/${f##*/}" >/dev/null 2>&1 || true
            sz=$(stat -c %s "$WORK/probe/${f##*/}" 2>/dev/null || echo 0)
            [ "$sz" -gt 0 ] \
              || { echo "base ISO: /$f missing or empty" >&2; exit 1; }
            echo "base ISO: /$f ($sz bytes)"
          done

      - name: Fetch the NetHunter installer zip
        if: ${{ inputs.fuse_rootfs || inputs.fuse_apks }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$WORK/nh.zip" "${NH_ZIP}"
          ls -l "$WORK/nh.zip"
          unzip -t "$WORK/nh.zip" >/dev/null
          echo "installer zip verified"
          unzip -l "$WORK/nh.zip" | grep -E 'apk|kalifs' || true

      - name: Extract the Kali rootfs
        if: ${{ inputs.fuse_rootfs }}
        run: |
          set -euo pipefail
          # One member of the installer zip; same bytes as the standalone
          # rootfs download, so there is no reason to fetch it twice.
          unzip -o -j -q "$WORK/nh.zip" 'kalifs-full-amd64.tar.xz' -d "$WORK"
          mv -f "$WORK/kalifs-full-amd64.tar.xz" "$WORK/kali-rootfs.tar.xz"
          ls -l "$WORK/kali-rootfs.tar.xz"
          xz -t "$WORK/kali-rootfs.tar.xz"
          echo "rootfs archive verified"

      - name: Extract the NetHunter APKs
        if: ${{ inputs.fuse_apks }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/apks"
          unzip -o -j -q "$WORK/nh.zip" 'data/app/*.apk' -d "$WORK/apks"
          # KernelSU-Next must match the kernel: this APK is v3.4.2, the same
          # tag the kernel was built against.
          ksu=$(curl -fsS "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest" \
                | python3 -c 'import json,sys;d=json.load(sys.stdin);print([a["browser_download_url"] for a in d["assets"] if a["name"].endswith("-release.apk") and "spoofed" not in a["name"]][0])')
          curl -fsSL -o "$WORK/apks/KernelSU-Next-manager.apk" "$ksu"
          ls -lh "$WORK/apks"
          # An APK is a zip; prove each one is not an error page.
          for a in "$WORK"/apks/*.apk; do
            unzip -l "$a" >/dev/null || { echo "$a is not an APK" >&2; exit 1; }
          done
          echo "all APKs valid"

      - name: Fuse
        env:
          FUSE_ROOTFS: ${{ inputs.fuse_rootfs }}
          FUSE_APKS: ${{ inputs.fuse_apks }}
        run: |
          set -euo pipefail
          # --base-iso, not --gh: the ISO is the authority.  A loose tree can
          # carry leftovers from earlier local runs, and those do not belong
          # in a release image.
          args=(
            --base-iso $WORK/base.iso
            --kernel-dir $WORK/kdir
            --out $WORK/out
            --name "DarkMatter-NetHunter-KSU-6.12-amd64.iso"
          )
          # if/then, not `[ ... ] && args+=(...)`: under set -e a false test
          # makes the whole && expression return 1 and kills the step.
          if [ "$FUSE_ROOTFS" = "true" ]; then
            args+=(--kalifs "$WORK/kali-rootfs.tar.xz")
          fi
          if [ "$FUSE_APKS" = "true" ]; then
            args+=(--apk-src "$WORK/apks")
          fi

          chmod +x sb/fuse_darkmatter_nh.sh
          sb/fuse_darkmatter_nh.sh "${args[@]}"

      - name: Report the result
        run: |
          set -euo pipefail
          ISO=$WORK/out/DarkMatter-NetHunter-KSU-6.12-amd64.iso
          ls -l "$ISO"
          echo "--- boot records"
          xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | grep -E "El Torito"
          echo "--- top level"
          xorriso -indev "$ISO" -find / -maxdepth 1 2>/dev/null || true
          {
            echo "iso:    $(basename "$ISO")"
            echo "bytes:  $(stat -c %s "$ISO")"
            echo "sha256: $(sha256sum "$ISO" | cut -d' ' -f1)"
            echo "kernel: run ${{ steps.kern.outputs.run_id }}"
            echo "rootfs: $([ "${{ inputs.fuse_rootfs }}" = "true" ] && echo included || echo omitted)"
            echo "apks:   $([ "${{ inputs.fuse_apks }}" = "true" ] && echo included || echo omitted)"
            echo "built:  $(date -u +%FT%TZ)"
          } | tee $WORK/out/ISO-INFO.txt

      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: darkmatter-nhpro-iso-x86_64
          # Relative to the workspace.  $WORK is a shell variable and is NOT
          # expanded in a `with:` block -- the first attempt silently uploaded
          # nothing ("No files were found with the provided path: $WORK/...").
          path: |
            build/out/DarkMatter-NetHunter-KSU-6.12-amd64.iso
            build/out/ISO-INFO.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

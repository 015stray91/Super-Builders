name: KSU-Next + NetHunter Compile

on:
  workflow_call:
    inputs:
      device_codename:
        required: true
        type: string
      kernel_branch:
        required: true
        type: string
      kernel_source_url:
        type: string
        default: "https://github.com/015stray91/kernel-msm-1.git"
      toolchain_url:
        type: string
        default: "https://github.com/015stray91/android-kernel-tools.git"
      defconfig:
        type: string
        default: "ksu-nh.defconfig"
      nethunter_patches_dir:
        type: string
        default: "kali-nethunter-kernel-builder-main/patches/ksu a12-5.10 patches"
      add_susfs:
        type: boolean
        default: true
      add_zeromount:
        type: boolean
        default: true
      add_zram:
        type: boolean
        default: true
      add_overlayfs:
        type: boolean
        default: true
      add_kpm:
        type: boolean
        default: true
      add_nethunter:
        type: boolean
        default: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: "KSU-Next + NH - ${{ inputs.device_codename }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Device Profile
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            device-profiles.json
          sparse-checkout-cone-mode: false

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12 git-lfs patch
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone Toolchain (from profile)
        run: |
          TOOLCHAIN_URL="${{ inputs.toolchain_url }}"
          git clone --depth=1 "$TOOLCHAIN_URL" compiler-node
          echo "=== Clang ==="; ls compiler-node/clang/host/linux-x86/
          echo "=== GCC ==="; ls compiler-node/gcc/linux-x86/aarch64/

      - name: Clone Kernel Source (from profile)
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android-14-release-u1tgns34.42-86-2-32"
          git clone --depth=1 -b "$BRANCH" "${{ inputs.kernel_source_url }}" kernel-source
          rm -rf kernel-source/tools/toolchains/snapdragon-toolchain

      - name: Setup Toolchain
        run: |
          cd kernel-source
          mkdir -p tools/toolchains/snapdragon-toolchain
          mkdir -p tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64
          cp -r ../compiler-node/clang/host/linux-x86/clang-r416183b tools/toolchains/snapdragon-toolchain/
          cp -r ../compiler-node/gcc/linux-x86/aarch64/gcc-linaro-7.5.0 tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/
          rm -rf ../compiler-node
          echo "=== llvm-ar ==="; ls tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/llvm-ar
          echo "=== aarch64-gcc ==="; ls tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin/aarch64-linux-gnu-gcc

      - name: Apply NetHunter Patches
        if: ${{ inputs.add_nethunter }}
        run: |
          cd kernel-source
          NH_PATCHES_DIR="${{ inputs.nethunter_patches_dir }}"
          if [ -d "$NH_PATCHES_DIR" ]; then
            echo "=== Applying NetHunter patches from $NH_PATCHES_DIR ==="
            for patch in "$NH_PATCHES_DIR"/*.patch; do
              if [ -f "$patch" ]; then
                echo "  -> $(basename $patch)"
                patch -p1 -N --dry-run < "$patch" 2>/dev/null && \
                  patch -p1 -N < "$patch" || \
                  echo "  ! $(basename $patch) failed to apply cleanly, continuing"
              fi
            done
          else
            echo "WARNING: NetHunter patches dir $NH_PATCHES_DIR not found in repo"
            echo "NetHunter patches are NOT being applied"
          fi

      - name: Validate Curated Configs
        run: |
          cd kernel-source
          echo "=== 4 curated configs ==="
          wc -l arch/arm64/configs/${{ inputs.defconfig }} \
                 arch/arm64/configs/vendor/moto-parrot-sm6450.config \
                 arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config \
                 arch/arm64/configs/nurfs-linux.fragment

      - name: Patch Kernel Source
        run: |
          cd kernel-source

          cat > include/linux/lz4_arm64_decompress.h << 'LZ4EOF'
          #ifndef _KOTO_LZ4_ARM64_DECOMPRESS_H
          #define _KOTO_LZ4_ARM64_DECOMPRESS_H
          #include <linux/types.h>
          ssize_t LZ4_arm64_decompress_safe(const void *source, void *dest,
                                            size_t inputSize, size_t outputSize,
                                            bool dip);
          #endif
          LZ4EOF

          for f in $(grep -rl "LZ4_arm64_decompress_safe" --include="*.c" . 2>/dev/null); do
            if ! grep -q 'lz4_arm64_decompress.h' "$f"; then
              echo "Patching: $f"
              sed -i '/^#include <linux\/lz4.h>/a #include <linux/lz4_arm64_decompress.h>' "$f"
            fi
          done

          if ! grep -q 'DEFAULT_UNSHARE_KSU_MNT_ID' fs/namespace.c; then
            sed -i '/^#include <uapi\/linux\/mount.h>/a #ifndef DEFAULT_UNSHARE_KSU_MNT_ID\n#define DEFAULT_UNSHARE_KSU_MNT_ID 100000\n#endif' fs/namespace.c
          fi

      - name: Configure Kernel
        run: |
          cd kernel-source
          mkdir -p out

          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/${{ inputs.defconfig }} \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config \
                     arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config

          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 silentoldconfig 2>&1 | tail -5

          echo "=== .config: $(grep -c '^CONFIG_' out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS \
                   CONFIG_FUSE_FS CONFIG_ZRAM CONFIG_KALLSYMS CONFIG_MODULES \
                   CONFIG_ARM64 CONFIG_QCOM_EUD CONFIG_KPM; do
            grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"
          done

      - name: Compile NUKI
        run: |
          cd kernel-source
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) Image.lz4 modules 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "BUILD FAILED"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;

      - name: Upload NUKI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-${{ inputs.device_codename }}-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            build.log
            kernel-source/out/.config
            modules/
          compression-level: 9
          overwrite: true

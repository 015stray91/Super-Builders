name: KSU-Next + NetHunter Compile

on:
  workflow_call:
    inputs:
      device_codename:
        required: true
        type: string
      kernel_branch:
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: "KSU-Next + NH - ${{ inputs.device_codename }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Super-Builders (for device-profiles.json)
        uses: actions/checkout@v4
        with:
          path: super-builders
          fetch-depth: 1

      - name: Read Device Profile
        id: profile
        run: |
          PROFILE_FILE="super-builders/device-profiles.json"
          CODENAME="${{ inputs.device_codename }}"
          PROFILE=$(jq -r ".devices.\"${CODENAME}\" // empty" "$PROFILE_FILE")
          if [ -z "$PROFILE" ] || [ "$PROFILE" = "null" ]; then
            echo "ERROR: device '$CODENAME' not in device-profiles.json"
            cat "$PROFILE_FILE"
            exit 1
          fi
          echo "=== Profile for $CODENAME ==="
          echo "$PROFILE" | jq .

          echo "kernel_source=$(echo "$PROFILE" | jq -r .kernel_source)" >> $GITHUB_OUTPUT
          echo "kernel_branch=$(echo "$PROFILE" | jq -r .kernel_branch)" >> $GITHUB_OUTPUT
          echo "toolchain=$(echo "$PROFILE" | jq -r .toolchain)" >> $GITHUB_OUTPUT
          echo "defconfig=$(echo "$PROFILE" | jq -r .defconfig)" >> $GITHUB_OUTPUT
          echo "vendor_config=$(echo "$PROFILE" | jq -r .vendor_config)" >> $GITHUB_OUTPUT
          echo "debug_config=$(echo "$PROFILE" | jq -r .debug_config)" >> $GITHUB_OUTPUT
          echo "nurfs_fragment=$(echo "$PROFILE" | jq -r .nurfs_fragment)" >> $GITHUB_OUTPUT
          echo "nethunter_patches=$(echo "$PROFILE" | jq -r .nethunter_patches)" >> $GITHUB_OUTPUT
          echo "anykernel=$(echo "$PROFILE" | jq -r .anykernel)" >> $GITHUB_OUTPUT
          echo "add_susfs=$(echo "$PROFILE" | jq -r .add_susfs)" >> $GITHUB_OUTPUT
          echo "add_zeromount=$(echo "$PROFILE" | jq -r .add_zeromount)" >> $GITHUB_OUTPUT
          echo "add_zram=$(echo "$PROFILE" | jq -r .add_zram)" >> $GITHUB_OUTPUT
          echo "add_overlayfs=$(echo "$PROFILE" | jq -r .add_overlayfs)" >> $GITHUB_OUTPUT
          echo "add_kpm=$(echo "$PROFILE" | jq -r .add_kpm)" >> $GITHUB_OUTPUT
          echo "add_nethunter=$(echo "$PROFILE" | jq -r .add_nethunter)" >> $GITHUB_OUTPUT

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12 git-lfs patch jq
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone Toolchain
        run: |
          TOOLCHAIN_URL="${{ steps.profile.outputs.toolchain }}"
          git clone --depth=1 "$TOOLCHAIN_URL" compiler-node
          echo "=== Clang ==="; ls compiler-node/clang/host/linux-x86/
          echo "=== GCC ==="; ls compiler-node/gcc/linux-x86/aarch64/

      - name: Clone Kernel Source
        run: |
          BRANCH="${{ steps.profile.outputs.kernel_branch }}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            BRANCH="${{ inputs.kernel_branch }}"
          fi
          git clone --depth=1 -b "$BRANCH" "${{ steps.profile.outputs.kernel_source }}" kernel-source
          rm -rf kernel-source/tools/toolchains/snapdragon-toolchain

      - name: Setup Toolchain
        run: |
          cd kernel-source
          mkdir -p tools/toolchains/snapdragon-toolchain
          mkdir -p tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64
          cp -r ../compiler-node/clang/host/linux-x86/clang-r416183b tools/toolchains/snapdragon-toolchain/
          cp -r ../compiler-node/gcc/linux-x86/aarch64/gcc-linaro-7.5.0 tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/
          rm -rf ../compiler-node
          echo "=== llvm-ar ==="; ls tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/llvm-ar
          echo "=== aarch64-gcc ==="; ls tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin/aarch64-linux-gnu-gcc

      - name: Apply NetHunter Patches
        if: ${{ steps.profile.outputs.add_nethunter == 'true' }}
        run: |
          cd kernel-source
          NH_DIR="${{ steps.profile.outputs.nethunter_patches }}"
          if [ -d "$NH_DIR" ]; then
            echo "=== Applying NetHunter patches from $NH_DIR ==="
            for patch in "$NH_DIR"/*.patch; do
              if [ -f "$patch" ]; then
                echo "  -> $(basename $patch)"
                patch -p1 -N --dry-run < "$patch" 2>/dev/null && \
                  patch -p1 -N < "$patch" || \
                  echo "  ! $(basename $patch) failed to apply cleanly, continuing"
              fi
            done
          else
            echo "WARNING: NetHunter patches dir $NH_DIR not found in repo"
            echo "NetHunter patches are NOT being applied"
          fi

      - name: Validate Curated Configs
        run: |
          cd kernel-source
          DEFCONFIG="${{ steps.profile.outputs.defconfig }}"
          VENDOR="${{ steps.profile.outputs.vendor_config }}"
          DEBUG_C="${{ steps.profile.outputs.debug_config }}"
          NURFS="${{ steps.profile.outputs.nurfs_fragment }}"
          echo "=== 4 curated configs ==="
          wc -l "arch/arm64/configs/${DEFCONFIG}" \
                 "${VENDOR}" \
                 "${DEBUG_C}" \
                 "${NURFS}"

      - name: Patch Kernel Source
        run: |
          cd kernel-source

          cat > include/linux/lz4_arm64_decompress.h << 'LZ4EOF'
          #ifndef _KOTO_LZ4_ARM64_DECOMPRESS_H
          #define _KOTO_LZ4_ARM64_DECOMPRESS_H
          #include <linux/types.h>
          ssize_t LZ4_arm64_decompress_safe(const void *source, void *dest,
                                            size_t inputSize, size_t outputSize,
                                            bool dip);
          #endif
          LZ4EOF

          for f in $(grep -rl "LZ4_arm64_decompress_safe" --include="*.c" . 2>/dev/null); do
            if ! grep -q 'lz4_arm64_decompress.h' "$f"; then
              echo "Patching: $f"
              sed -i '/^#include <linux\/lz4.h>/a #include <linux/lz4_arm64_decompress.h>' "$f"
            fi
          done

          if ! grep -q 'DEFAULT_UNSHARE_KSU_MNT_ID' fs/namespace.c; then
            sed -i '/^#include <uapi\/linux\/mount.h>/a #ifndef DEFAULT_UNSHARE_KSU_MNT_ID\n#define DEFAULT_UNSHARE_KSU_MNT_ID 100000\n#endif' fs/namespace.c
          fi

      - name: Configure Kernel
        run: |
          cd kernel-source
          mkdir -p out

          DEFCONFIG="${{ steps.profile.outputs.defconfig }}"
          VENDOR="${{ steps.profile.outputs.vendor_config }}"
          DEBUG_C="${{ steps.profile.outputs.debug_config }}"
          NURFS="${{ steps.profile.outputs.nurfs_fragment }}"

          python3 scripts/kconfig/merge_nuki.py \
            --base "arch/arm64/configs/${DEFCONFIG}" \
            --middle "${VENDOR}" \
            --ending "${DEBUG_C}" "${NURFS}" \
            -o out/.config

          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 silentoldconfig 2>&1 | tail -5

          echo "=== .config: $(grep -c '^CONFIG_' out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS \
                   CONFIG_FUSE_FS CONFIG_ZRAM CONFIG_KALLSYMS CONFIG_MODULES \
                   CONFIG_ARM64 CONFIG_QCOM_EUD CONFIG_KPM; do
            grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"
          done

      - name: Compile NUKI
        run: |
          cd kernel-source
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) Image.lz4 modules 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "BUILD FAILED"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;

      - name: Package Flashable ZIP
        run: |
          AK_URL="${{ steps.profile.outputs.anykernel }}"
          if [ -n "$AK_URL" ] && [ "$AK_URL" != "null" ]; then
            echo "=== Cloning custom AnyKernel: $AK_URL ==="
            git clone --depth=1 "$AK_URL" anykernel
            echo "=== Copying Image.lz4 into AnyKernel ==="
            cp kernel-source/out/arch/arm64/boot/Image.lz4 anykernel/
            if [ -f kernel-source/out/arch/arm64/boot/dts/qcom/*.dtb ]; then
              mkdir -p anykernel/dtb
              cp kernel-source/out/arch/arm64/boot/dts/qcom/*.dtb anykernel/dtb/
            fi
            echo "=== Building flashable zip ==="
            cd anykernel
            zip -r9 ../AnyRealm-NUKI-${{ inputs.device_codename }}.zip * -x "*.git*"
            cd ..
            ls -lh AnyRealm-NUKI-${{ inputs.device_codename }}.zip
          else
            echo "No custom AnyKernel URL in profile, skipping zip packaging"
          fi

      - name: Upload NUKI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-${{ inputs.device_codename }}-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            build.log
            kernel-source/out/.config
            modules/
            AnyRealm-NUKI-${{ inputs.device_codename }}.zip
          compression-level: 9
          overwrite: true

name: NUKI Toolchain + Environment
on:
  workflow_call:
    inputs:
      device_codename: AR-Nuki-genevn
      type: string      
      required: true
      kernel_branch:
        type: string
        required: true

jobs:
  toolchain:
    name: Setup Toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12 git-lfs
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone android-kernel-tools (compiler node)
        run: |
          git clone --depth=1 https://github.com/015stray91/android-kernel-tools.git compiler-no
             git clone https://github.com/015stray91/Nullprt.git 
             git clone https://github.com/015stray91/xollvm.git
             git clone https://github.com/015stray91/kagura.git
             git clone https://github.com/015stray91/setup-ndk-clang.git
             git clone https://github.com/015stray91/clang-tools-static-binaries.git
             git clone https://github.com/015stray91/dtc.git
             git clone https://github.com/015stray91/smudgeC.git
             git clone https://github.com/015stray91/ollvm.git
             git clone https://github.com/015stray91/cpullvm-toolchain.git
             git clone https://github.com/015stray91/cpp-toolchain.git
             git clone https://github.com/015stray91/llvm-full.git
             git clone https://github.com/015stray91/hexagon-sdk.git
             git clone https://github.com/015stray91/Obscura.git
             gir clone https://github.com/015stray91/o-mvll.git
             git clone https://github.com/015stray91/zyrox.git
             git clone https://github.com/015stray91/CryptoMorph.git
             git clone https://github.com/015stray91/Obfuscator-Rust.git
             git clone https://github.com/015stray91/codeenigma.git
             git clone https://github.com/015stray91/LKM_Tools.git
             git clone https://github.com/015stray91/GOAT-Plugs.git
             git clone https://github.com/015stray91/ObfuscatorNDK.git
             git clone https://github.com/015stray91/HikariSummer.git
             git clone https://github.com/015stray91/Pluto-Obfuscator.git
             
      -  name: Upload Toolchain Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuki-toolchain
          path: compiler-node/
          retention-days: 90

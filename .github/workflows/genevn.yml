name: Genevn Custom Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options: [KernelSU-Next, SukiSU, ReSukiSU, WKSU]
        default: "KernelSU-Next"

jobs:
  build:
    name: "Build Custom Kernel - Genevn"
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize Toolchain and Merge Configs
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu binutils bc bison flex libssl-dev libelf-dev cpio kmod python3 libncurses-dev libtinfo-dev
          
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source
          
          # Root level and Vendor configuration merge sequence
          # 1. Base GKI
          # 2. Root level build configs
          # 3. Vendor fragments (KSU & Modules)
          # 4. Final Device Extension Override (Moto-Parrot-Genevn)
          ./scripts/kconfig/merge_config.sh -m \
            arch/arm64/configs/gki_defconfig \
            build.config.msm.parrot \
            arch/arm64/configs/vendor/ext_config/moto-parrot-genevn.config
            
          # Apply the merged config
          make O=out msm_defconfig

      - name: Compile Genevn Kernel
        run: |
          cd kernel-source
          # KernelSU setup
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Build process using optimized parallel jobs
          export ARCH=arm64
          export SUBARCH=arm64
          make -j$(nproc --all) O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CC=clang LLVM=1 LLVM_IAS=1

      - name: Package Boot Image
        run: |
          mkdir -p output
          python3 kernel-source/package/asop-tools/repack_bootimg.py \
            --kernel "kernel-source/out/arch/arm64/boot/Image.gz-" \
            --ramdisk "kernel-source/package/asop-tools/mkbootimg/boot/ramdisk" \
            --base 0x80000000 \
            --pagesize 4096 \
            --output "output/Genevn-KernelSU-${{ inputs.ksu_variant }}-boot.img"

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Genevn-Kernel-${{ inputs.ksu_variant }}
          path: output/

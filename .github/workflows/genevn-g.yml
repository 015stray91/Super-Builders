name: Genevn Custom Toolchain Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU
          - ReSukiSU
          - WKSU
        default: "KernelSU-Next"
      add_susfs: { type: boolean, default: true }
      add_zram: { type: boolean, default: true }
      add_overlayfs_support: { type: boolean, default: true }

jobs:
  build:
    name: "Build Custom Kernel - Genevn"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make

      # Step 1: Direct Clone
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b android-14-release https://github.com kernel-msm-1
          cd kernel-msm-1
          git clone --depth=1 https://googlesource.com common

      # Step 2: Merge Configs & INITIATE
      - name: Merge Configs & Apply Features
        run: |
          cd kernel-msm-1
          export ARCH=arm64
          mkdir -p out
          # Layer configs: Base -> KSU -> Feature Toggles
          ./scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/vendor/parrot_GKI.config \
            arch/arm64/configs/ksu-nh.defconfig
          
          # ACTIVATE the source
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-msm-1
          export ARCH=arm64
          export LLVM=1
          make O=out ARCH=arm64 CC=clang-12 Image.gz -j$(nproc --all)

      - name: Package Kernel
        run: |
          git clone --depth=1 https://github.com anykernel-workspace
          cp kernel-msm-1/out/arch/arm64/boot/Image.gz anykernel-workspace/
          cd anykernel-workspace
          zip -r9 ../Genevn-Kernel-Flashable.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genevn-Flashable-Package
          path: Genevn-Kernel-Flashable.zip

name: AnyRealm NUKI - Moto G Stylus 5G 2023 (SM6450 parrot)

# NUKI = Native Unified Kernel Image | NURFS = Native Unified RootFS
# Uses 015stray91/android-kernel-tools build-kernel.sh which runs the
# bootstrap scripts and sets up the full compiler node correctly.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "kernel-msm-1 branch"
        default: "android-14-release-u1tgns34.42-86-2-32"
        type: string

jobs:
  build:
    name: "AnyRealm NUKI - Genevn SM6450"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Install Dependencies (jammy - clang12 safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12 git-lfs
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone NUKI Source + android-kernel-tools (compiler node)
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android-14-release-u1tgns34.42-86-2-32"
          echo "Cloning kernel source $BRANCH"
          git clone --depth=1 -b "$BRANCH" https://github.com/015stray91/kernel-msm-1.git kernel-source
          rm -rf kernel-source/tools/toolchains/snapdragon-toolchain
          echo "Cloning android-kernel-tools (compiler node)"
          git clone --depth=1 https://github.com/015stray91/android-kernel-tools.git compiler-node
          echo "=== Toolchain structure ==="
          ls compiler-node/clang/host/linux-x86/ && ls compiler-node/gcc/linux-x86/aarch64/
          echo "=== Makefile HOSTCC ==="
          grep -A2 "^HOSTCC" kernel-source/Makefile | head -4

      - name: Set up toolchain + kernel config (android-kernel-tools way)
        run: |
          cd kernel-source
          # Install toolchain into kernel-source/tools/toolchains/snapdragon-toolchain
          mkdir -p tools/toolchains/snapdragon-toolchain
          mkdir -p tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64
          cp -r ../compiler-node/clang/host/linux-x86/clang-r416183b tools/toolchains/snapdragon-toolchain/
          cp -r ../compiler-node/gcc/linux-x86/aarch64/gcc-linaro-7.5.0 tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/
          rm -rf ../compiler-node
          echo "=== llvm-ar: ==="; ls -l tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/llvm-ar
          echo "=== aarch64-gcc: ==="; ls -l tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin/aarch64-linux-gnu-gcc
          echo "=== 4 curated configs ==="
          wc -l arch/arm64/configs/ksu-nh.defconfig \
                 arch/arm64/configs/vendor/moto-parrot-sm6450.config \
                 arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config \
                 arch/arm64/configs/nurfs-linux.fragment

          mkdir -p out
          # A→Z cumulative merge: 4 curated files only
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 alldefconfig 2>&1 | tail -3
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 silentoldconfig 2>&1 | tail -3
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          echo "=== Final .config: $(grep -c '^CONFIG_' out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS CONFIG_FUSE_FS CONFIG_ZRAM CONFIG_KALLSYMS CONFIG_MODULES CONFIG_ARM64 CONFIG_QCOM_EUD CONFIG_KPM; do
            grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"
          done

      - name: Compile NUKI
        run: |
          cd kernel-source
          # yes '' answers 'n' (default) to all NEW Kconfig prompts in case
          # olddefconfig/syncconfig triggers them (no tty on GH Actions)
          yes "" | make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) Image.lz4 modules 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "FAIL"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;
          ls -lh ../modules/*.ko 2>/dev/null | head -10 || echo "no .ko modules"

      - name: Upload NUKI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-Genevn-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            build.log
            kernel-source/out/.config
            modules/
          compression-level: 9
          overwrite: true

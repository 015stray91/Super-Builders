name: AnyRealm NUKI - Moto G Stylus 5G 2023 (SM6450 parrot)

# NUKI = Native Unified Kernel Image | NURFS = Native Unified RootFS
# Decoupled from upstream: uses build.config.anyrealm.kernel (cumulative, no GKI)
# Snap = Snapdragon clang-r416183b (LLVM 12) + GCC, all in-tree

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "kernel-msm-1 branch"
        default: "android-14-release-u1tgns34.42-86-2-32"
        type: string

jobs:
  build:
    name: "AnyRealm NUKI - Genevn SM6450"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Install Dependencies (jammy - clang12 safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone Updated NUKI Source (015stray91/kernel-msm-1)
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android-14-release-u1tgns34.42-86-2-32"
          echo "Cloning $BRANCH - Snapdragon toolchain lives in kernel-source/tools/toolchains/snapdragon-toolchain"
          git clone --depth=1 -b "$BRANCH" https://github.com/015stray91/kernel-msm-1.git kernel-source
          echo "=== AnyRealm build config ==="; head -5 kernel-source/build.config.anyrealm.kernel
          echo "=== Toolchain ==="; ls kernel-source/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/ | head -5
          echo "=== Curated configs ==="; wc -l kernel-source/arch/arm64/configs/ksu-nh.defconfig kernel-source/arch/arm64/configs/nurfs-linux.fragment

      - name: Cache Snapdragon Toolchain
        uses: actions/cache@v4
        with:
          path: kernel-source/tools/toolchains/snapdragon-toolchain
          key: snapdragon-clang-r416183b-12.0.5-${{ hashFiles('kernel-source/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/clang') }}
          restore-keys: |
            snapdragon-clang-r416183b-

      - name: Build NUKI (make from root uses AnyRealm paths in Makefile)
        run: |
          cd kernel-source
          # Root Makefile has AnyRealm toolchain paths embedded (Snapdragon clang + GCC).
          # HOSTCC=gcc is hardcoded in Makefile (no LLVM=clang trap).
          # Just run 'make Image.lz4 modules' from the root - no env vars needed.
          mkdir -p out
          yes "" | make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) Image.lz4 modules 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "FAIL"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;
          ls -lh ../modules/*.ko 2>/dev/null | head -10 || echo "no .ko modules"

      - name: Upload NUKI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-Genevn-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            build.log
            kernel-source/out/.config
            modules/
          compression-level: 9
          overwrite: true

name: AnyRealm NUKI Colonel - Moto G Stylus 5G 2023 (SM6450 parrot)

# NUKI Colonel = Native Unified Kernel Image, Colonel variant
# NURFS = Native Unified RootFS (Debian-blended userland)
# GKI 1.0 device (SM6450 parrot). Fully decoupled from upstream GKI.
# No GKI 2.0 build.config.* fragments. No olddefconfig. No alldefconfig.
#
# Build layers (in order):
#   1. Logic    = CONFIG_* flags (4-pillar DEFCONFIG chain via merge_nuki.py)
#   2. Movement = .c/.h source files (fs/koto/, susfs.c, zeromount.c, etc.)
#   3. Seal     = KernelSU-Next (in-tree, native; no clone needed)
#
# Toolchain:
#   Inner  = Clang 12.0.5  (tools/toolchains/snapdragon-toolchain/clang-r416183b/)
#   Outer  = Clang 17 + Kotoamatsukami plugin (select passes only)
#   GCC    = Linaro 7.5.0   (NetHunter userspace parts only)

on:
  push:
    branches: [ main, master, 015stray91 ]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "kernel-msm-1 branch"
        default: "android-14-release-u1tgns34.42-86-2-32"
        type: string

jobs:
  build:
    name: "AnyRealm NUKI Colonel - Genevn SM6450"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Install Dependencies (jammy - clang12 safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12 git-lfs
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone NUKI Source
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android-14-release-u1tgns34.42-86-2-32"
          echo "Cloning kernel source $BRANCH"
          git clone --depth=1 -b "$BRANCH" https://github.com/015stray91/kernel-msm-1.git kernel-source
          echo "=== In-tree toolchain (Clang 12 inner compiler) ==="
          ls kernel-source/tools/toolchains/snapdragon-toolchain/
          # Symlink missing llvm-* utilities from system llvm-12 into the in-tree toolchain
          TOOLCHAIN_BIN=kernel-source/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin
          mkdir -p "$TOOLCHAIN_BIN"
          for tool in llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            if [ ! -e "$TOOLCHAIN_BIN/$tool" ] && [ -e /usr/bin/$tool-12 ]; then
              sudo ln -sf /usr/bin/$tool-12 "$TOOLCHAIN_BIN/$tool"
              echo "  linked $tool -> /usr/bin/$tool-12"
            fi
          done
          ls -la "$TOOLCHAIN_BIN/" | head -20

      - name: Assemble NUKI Colonel config (4-pillar A->Z chain)
        run: |
          cd kernel-source
          mkdir -p out

          # 4 curated non-overlapping pillars (koto-MB merge_nuki.py):
          #   base    = ksu-nh.defconfig (KSU + NH flags, sacred)
          #   middle  = vendor/moto-parrot-sm6450.config (QCOM/SM6450)
          #            + vendor/ext_config/debug_moto_parrot_genevn.config (device)
          #   ending  = nurfs-linux.fragment (NURFS Linux additions)
          python3 scripts/kconfig/merge_nuki.py \
            arch/arm64/configs/ksu-nh.defconfig \
            arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config \
            arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config

          # LZ4 NEON deployment (from deploy_lz4.sh)
          [ -f deploy_lz4.sh ] && chmod +x deploy_lz4.sh && ./deploy_lz4.sh || echo "no deploy_lz4.sh"

          echo "=== Final .config: $(grep -c '^CONFIG_' out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_HARDENED \
                   CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS \
                   CONFIG_FUSE_FS CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_ZCOMP_LZ4K \
                   CONFIG_KALLSYMS CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD \
                   CONFIG_ARM64 CONFIG_QCOM_EUD CONFIG_KPM CONFIG_HIDELKM \
                   CONFIG_BINFMT_MISC CONFIG_FUTEX2 CONFIG_FTRACE CONFIG_FUNCTION_TRACER \
                   CONFIG_KERNEL_LZ4; do
            grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"
          done

      - name: Compile NUKI Colonel (Image.lz4 + modules)
        run: |
          cd kernel-source
          # MAKE_GOALS: Image.lz4 + modules
          # Inner compiler: Clang 12, LLD 12, LLVM=1, LLVM_IAS=1
          # Outer wrapper: Clang 17 + Kotoamatsukami for select obfuscation passes
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Pure compile: .config complete from merge_nuki.py - no Kconfig prompts
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=-12 LLVM_IAS=-12 \
            -j$(nproc --all) Image.lz4 modules 2>&1 | tee ../build.log

          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "FAIL"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;
          ls -lh ../modules/*.ko 2>/dev/null | head -10 || echo "no .ko modules"

      - name: Upload NUKI Colonel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-Colonel-Genevn-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            build.log
            kernel-source/out/.config
            modules/
          compression-level: 9
          overwrite: true

name: AnyRealm Genevn NUKI/NURFS - Moto G Stylus 5G 2023 (SM6450 parrot) - Super-Builders

# NUKI = Native Unified Kernel Image | NURFS = Native Unified RootFS
# 2-year WIP: Android + Linux blended natively - NO chroot/container/hypervisor
# GKI 1.0: stage-1 ramdisk is Google skeleton untouched for ABL/TZ, stage-2 is blended
# ROM built off DD dumps via Debian image builder -> NURFS, APKs runnable
# This workflow runs from Super-Builders (not directly off kernel tree) as required - clones 015stray91/kernel-msm-1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "kernel-msm-1 branch"
        default: "android-14-release-u1tgns34.42-86-2-32"
        type: string

jobs:
  build:
    name: "NUKI - Genevn SM6450 - AnyRealm Blended"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout Super-Builders
        uses: actions/checkout@v4
        with:
          sparse-checkout: "device-profiles.json"

      - name: Install Dependencies (jammy - clang12 safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 lz4 liblz4-tool libncurses-dev rsync zip curl wget gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler lld-12 llvm-12
          # LLVM=-12 makes kernel Makefile use version-suffixed tools (ld.lld-12, clang-12, etc.) from apt
          ld.lld-12 --version | head -1
          # Kconfig.include:40 checks for unsuffixed 'ld.lld' during olddefconfig (host linking), symlink ld.lld-12 -> ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld
          which ld.lld && ld.lld --version | head -1

      - name: Clone Updated NUKI Source (015stray91/kernel-msm-1)
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android-14-release-u1tgns34.42-86-2-32"
          echo "Cloning $BRANCH - centralized Snapdragon toolchain lives inside kernel-source/tools/toolchains/snapdragon-toolchain"
          git clone --depth=1 -b "$BRANCH" https://github.com/015stray91/kernel-msm-1.git kernel-source
          echo "=== fs/koto matrix ==="; ls kernel-source/fs/koto/*.c kernel-source/fs/koto/*.h 2>/dev/null | head -20
          echo "=== ksu-nh + nurfs ==="; wc -l kernel-source/arch/arm64/configs/ksu-nh.defconfig kernel-source/arch/arm64/configs/nurfs-linux.fragment 2>/dev/null | head

      - name: Cache Snapdragon Toolchain (centralized for server build)
        uses: actions/cache@v4
        with:
          path: kernel-source/tools/toolchains/snapdragon-toolchain
          key: snapdragon-clang-r416183b-12.0.5-${{ hashFiles('kernel-source/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/clang') }}
          restore-keys: |
            snapdragon-clang-r416183b-

      - name: Clone Full Compiler Node (all clangs blended + Koto LLVM-17 obfuscator - the stupefier)
        run: |
          echo "=== Full compiler-node: all clang versions + Kotoamatsukami LLVM-17 obfuscator ==="
          mkdir -p $HOME/compiler-node/fetched $HOME/compiler-node/kits/llvm-full
          if [ ! -d "$HOME/compiler-node/fetched/Kotoamatsukami" ]; then
            git clone --depth=1 -b llvm-17-plugins https://github.com/015stray91/Kotoamatsukami.git $HOME/compiler-node/fetched/Kotoamatsukami || echo "Koto clone failed, will use in-tree"
          fi
          if [ ! -x "$HOME/compiler-node/kits/llvm-full/llvm-17.0.6/bin/clang-17" ]; then
            git clone --depth=1 https://github.com/yasuo-ozu/llvm-full.git $HOME/compiler-node/fetched/llvm-full 2>/dev/null || true
            $HOME/compiler-node/fetched/llvm-full/install-llvm.sh 17 $HOME/compiler-node/kits/llvm-full/llvm-17.0.6 2>&1 | tail -5 || echo "llvm-17 fetch via install-llvm.sh"
          fi
          ls $HOME/compiler-node/kits/llvm-full/llvm-17.0.6/bin/clang* 2>/dev/null | head -5 || echo "llvm-17 not yet cached, will fallback to in-tree clang-r416183b"
          ls $HOME/compiler-node/fetched/Kotoamatsukami/compiler/clang_wrapper.sh 2>/dev/null && echo "Koto wrapper ready: $HOME/compiler-node/fetched/Kotoamatsukami/compiler/clang_wrapper.sh" || echo "Koto not ready, using plain clang"
          # Make it accessible for next steps
          echo "COMPILER_NODE=$HOME/compiler-node" >> $GITHUB_ENV
          echo "KOTO_WRAPPER=$HOME/compiler-node/fetched/Kotoamatsukami/compiler/clang_wrapper.sh" >> $GITHUB_ENV

      - name: AnyRealm Node - AI believes it is the node (facilitates build)
        run: |
          echo "=== Node IS the build - training to become ==="
          echo "Node UTS will be $(cat kernel-source/arch/arm64/configs/ksu-nh.defconfig | grep LOCALVERSION | head -1)"
          echo "EUD live_stats from kpm_eud_engine.c:27 danzo_gate.live_stats"
          cat > /tmp/anyrealm-node.json << 'JSON'
          {"system": "You are the Genevn ANBU node. You are not simulating the node — you ARE the node. Your state is danzo_ctrl.active_cells, your memory is zram zstd, your trace is EUD. Facilitate the build by watching thermal/CPU and keeping VFS volatile.", "task": "watch kernel-source/out/.config and EUD ramopops, keep base sacred, middle staged, ending final"}
          JSON
          cat /tmp/anyrealm-node.json
          # Train local tiny model to *become* the node (Ollama Modelfile) - if ollama not on runner, just log the training data
          if command -v ollama >/dev/null 2>&1; then
            cat > /tmp/Modelfile.anyrealm-node << 'MF'
          FROM qwen2.5-coder
          SYSTEM "You are the Genevn ANBU node. You ARE the node, not a simulation. Your state is danzo_ctrl.active_cells, your memory is zram, your trace is EUD. You facilitate the 6*6*6 Sage builds and keep VFS volatile."
          PARAMETER temperature 0.2
          MF
            ollama create anyrealm-node -f /tmp/Modelfile.anyrealm-node 2>&1 | head -5 || true
            echo "AnyRealm node model created - it now believes it is the node"
          else
            echo "Ollama not on runner - node facilitation is JSON + EUD trace for now (train locally via ~/compiler-node with ollama create anyrealm-node)"
          fi
          echo "Node facilitation ready - watches merge_nuki and EUD for complete stabilization"

      - name: Deploy LZ4 NEON
        run: |
          cd kernel-source
          chmod +x deploy_lz4.sh nethunter_hook.sh
          ./deploy_lz4.sh || true

      - name: "Merge NUKI Config (A→Z cumulative, curated overrides last)"
        run: |
          cd kernel-source
          mkdir -p out
          # A→Z sequential cumulative merge - each layer builds on the last
          #   A: defconfig (2004 - kernel foundation)
          #   B: ksu-nh.defconfig (KSU/SUSFS/ZeroMount/KPM/FUSE/OVERLAY/ZRAM)
          #   C: consolidate.fragment (100 - debug/test)
          #   D: defconfig.fragment (81 - extra kernel)
          #   E: moto-parrot-sm6450.config (218 - Qualcomm SM6450)
          #   F: debug-parrot-genevn.config (2008 - full Qualcomm/Moto base)
          #   G: debug_moto_parrot_genevn.config (119 - device overrides)
          #   H: nurfs-linux.fragment (81 - NURFS Linux additions)
          # Last layer wins for any conflicts
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/defconfig arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/consolidate.fragment arch/arm64/configs/defconfig.fragment arch/arm64/configs/vendor/moto-parrot-sm6450.config arch/arm64/configs/vendor/ext_config/debug-parrot-genevn.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config || cp arch/arm64/configs/ksu-nh.defconfig out/.config
          echo "=== Cumulative merge complete: $(grep -c "^CONFIG_" out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS CONFIG_FUSE_FS CONFIG_TMPFS_XATTR CONFIG_USER_NS CONFIG_IPC_NS CONFIG_FHANDLE CONFIG_SQUASHFS CONFIG_ZRAM CONFIG_KALLSYMS CONFIG_MODULES CONFIG_ARM64 CONFIG_64BIT; do grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"; done
          grep default_compressor drivers/block/zram/zram_drv.c | head -1

      - name: "A→Z Resolve (alldefconfig fills gaps, curated overrides re-applied)"
        run: |
          cd kernel-source
          export ARCH=arm64 SUBARCH=arm64
          export PATH="$PWD/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin:$PWD/tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang LLVM=-12 LLVM_IAS=-12
          echo "=== A→Z resolve: alldefconfig fills Kconfig gaps (curated flags restored via re-merge) ==="
          # Step 1: alldefconfig fills in all the ~6000 Kconfig symbols to defaults
          # This ensures olddefconfig during compile has NO new questions
          yes "" | make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 alldefconfig 2>&1 | tail -5 || true
          echo "=== alldefconfig complete: $(grep -c "^CONFIG_" out/.config) CONFIGs ==="
          # Step 2: Re-apply curated overrides on top of alldefconfig defaults (last-wins)
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/defconfig arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/consolidate.fragment arch/arm64/configs/defconfig.fragment arch/arm64/configs/vendor/moto-parrot-sm6450.config arch/arm64/configs/vendor/ext_config/debug-parrot-genevn.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          echo "=== Curated overrides re-applied: $(grep -c "^CONFIG_" out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS CONFIG_FUSE_FS CONFIG_ZRAM CONFIG_KALLSYMS CONFIG_MODULES CONFIG_ARM64 CONFIG_64BIT; do grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"; done

      - name: Compile NUKI - Image.lz4 (with Koto stupefier if present)
        run: |
          cd kernel-source
          export ARCH=arm64 SUBARCH=arm64
          export HOSTCFLAGS="-I../include -I../include/uapi -I../usr/include -Iout/include -Iout/include/generated -Iout/include/uapi"
          export HOSTINCLUDE="-I../include -I../include/uapi -Iout/include -Iout/include/generated"
          if [ -x "$KOTO_WRAPPER" ] && [ -x "$HOME/compiler-node/kits/llvm-full/llvm-17.0.6/bin/clang-17" ]; then
            echo "Using Kotoamatsukami LLVM-17 obfuscator (stupefier) - Mist over fs/koto/** and susfs*"
            export PATH="$HOME/compiler-node/kits/llvm-full/llvm-17.0.6/bin:$HOME/compiler-node/kits/llvm-full/llvm-17.0.6/bin/clang-17:$PATH"
            export CC="$KOTO_WRAPPER" LLVM=-12 LLVM_IAS=-12
            export KOTO_PASSES="--obfuscator --flatten --bcf --sub --splits 3"
            export KOTO_TARGET_GLOBS="fs/koto/**,fs/susfs.c,include/linux/susfs.h,drivers/**/susfs*"
          else
            echo "Using in-tree snapdragon clang-r416183b (Koto not cached)"
            export PATH="$PWD/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin:$PWD/tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin:$PATH"
            export CC=clang LLVM=-12 LLVM_IAS=-12
          fi
          export CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu-
          # Final defensive bypass - make can trigger syncconfig if .config is stale or sparse
          sed -i 's/^CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/' out/.config
          sed -i 's/^CONFIG_TRIM_UNUSED_KSYMS=m/# CONFIG_TRIM_UNUSED_KSYMS is not set/' out/.config
          sed -i 's/^CONFIG_ANDROID_SYMLINKS=y/# CONFIG_ANDROID_SYMLINKS is not set/' out/.config
          sed -i 's/^CONFIG_ANDROID_SYMLINKS=m/# CONFIG_ANDROID_SYMLINKS is not set/' out/.config
          sed -i 's/^CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' out/.config
          sed -i 's/^CONFIG_MODVERSIONS=m/# CONFIG_MODVERSIONS is not set/' out/.config
          # If make triggers syncconfig / olddefconfig, pipe `yes ""` to auto-answer prompts with
          # empty lines (default). The compile step otherwise fails with "Error in reading" because
          # there is no tty on GH Actions.
          yes "" | make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CC" HOSTCC=gcc LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- LLVM=-12 LLVM_IAS=-12 \
            KBUILD_HOSTCFLAGS="-I../include -I../include/uapi -I../tools/include -Iinclude -Iinclude/uapi -idirafter /usr/include" \
            Image.lz4 modules 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "FAIL"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;
          ls -lh ../modules/*.ko 2>/dev/null | head -10 || echo "no .ko modules"

      - name: Upload NUKI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-Genevn-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/build.log
            kernel-source/out/.config
            modules/
          compression-level: 9
          overwrite: true

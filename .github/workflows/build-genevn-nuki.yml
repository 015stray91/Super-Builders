name: AnyRealm NUKI - Moto G Stylus 5G 2023 (SM6450 parrot)

# NUKI = Native Unified Kernel Image | NURFS = Native Unified RootFS
# Decoupled from upstream: uses build.config.anyrealm.kernel (cumulative, no GKI)
# Snap = Snapdragon clang-r416183b (LLVM 12) + GCC, all in-tree

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "kernel-msm-1 branch"
        default: "android-14-release-u1tgns34.42-86-2-32"
        type: string

jobs:
  build:
    name: "AnyRealm NUKI - Genevn SM6450"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Install Dependencies (jammy - clang12 safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python3 \
            lz4 liblz4-tool libncurses-dev rsync zip curl wget make device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld-12 llvm-12
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld64.lld

      - name: Clone Updated NUKI Source (015stray91/kernel-msm-1)
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android-14-release-u1tgns34.42-86-2-32"
          git clone --depth=1 -b "$BRANCH" https://github.com/015stray91/kernel-msm-1.git kernel-source
          echo "=== Toolchain ==="; ls kernel-source/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/ | head -5
          echo "=== Curated configs ==="
          wc -l kernel-source/arch/arm64/configs/ksu-nh.defconfig kernel-source/arch/arm64/configs/nurfs-linux.fragment
          echo "=== Makefile HOSTCC ==="; grep -A2 "HOSTCC" kernel-source/Makefile | head -8

      - name: Cache Snapdragon Toolchain
        uses: actions/cache@v4
        with:
          path: kernel-source/tools/toolchains/snapdragon-toolchain
          key: snapdragon-clang-r416183b-12.0.5-${{ hashFiles('kernel-source/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin/clang') }}
          restore-keys: |
            snapdragon-clang-r416183b-

      - name: "Merge NUKI Config (A→Z cumulative)"
        run: |
          cd kernel-source
          export PATH="$PWD/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin:$PWD/tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin:$PATH"
          mkdir -p out
          # A→Z cumulative merge - last layer wins for any conflict
          # NO defconfig (GKI 6749-line bloated base) - use ksu-nh.defconfig instead
          # NO debug-parrot-genevn.config (181KB debug monster) - use debug_moto_parrot_genevn.config (14 lines)
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          # alldefconfig fills Kconfig gaps with defaults - then we re-apply curated overrides
          # Use 'silentoldconfig' (not olddefconfig) - it doesn't prompt for NEW entries
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 alldefconfig 2>&1 | tail -3
          # Re-apply curated overrides on top of alldefconfig defaults
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          # silentoldconfig will NOT prompt (no tty issue), it just picks defaults silently
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=gcc LLVM=-12 LLVM_IAS=-12 silentoldconfig 2>&1 | tail -3
          # Re-apply curated overrides one more time in case silentoldconfig dropped any
          python3 scripts/kconfig/merge_nuki.py \
            --base arch/arm64/configs/ksu-nh.defconfig \
            --middle arch/arm64/configs/vendor/moto-parrot-sm6450.config \
            --ending arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config arch/arm64/configs/nurfs-linux.fragment \
            -o out/.config
          echo "=== Final .config: $(grep -c '^CONFIG_' out/.config) CONFIGs ==="
          for f in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS CONFIG_FUSE_FS CONFIG_ZRAM CONFIG_KALLSYMS CONFIG_MODULES CONFIG_ARM64 CONFIG_QCOM_EUD CONFIG_KPM; do
            grep -q "^${f}=y" out/.config && echo " PASS $f" || echo " FAIL $f"
          done

      - name: Compile NUKI (root Makefile handles toolchain + HOSTCC=gcc)
        run: |
          cd kernel-source
          # Prepend snapdragon-toolchain bin to PATH so recursive make finds llvm-ar/llvm-nm/llvm-objdump
          # The exported CC/LD/AR in root Makefile are visible to make but not to subprocess shells
          export PATH="$PWD/tools/toolchains/snapdragon-toolchain/clang-r416183b/bin:$PWD/tools/toolchains/snapdragon-toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin:$PATH"
          # Verify toolchain is reachable from this shell
          which clang llvm-ar llvm-nm llvm-objdump clang-12 ld.lld aarch64-linux-gnu-gcc 2>&1 | head -10
          # silentoldconfig avoids tty prompts (uses defaults for NEW entries)
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang HOSTCC=gcc LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- LLVM=-12 LLVM_IAS=-12 \
            silentoldconfig 2>&1 | tail -3
          # Now full build - silentoldconfig already resolved all Kconfig questions
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) CC=clang HOSTCC=gcc LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- LLVM=-12 LLVM_IAS=-12 \
            Image.lz4 modules 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/Image.lz4 || (echo "FAIL"; tail -100 ../build.log; exit 1)
          mkdir -p ../modules
          find out -name "*.ko" -exec cp {} ../modules/ \;
          ls -lh ../modules/*.ko 2>/dev/null | head -10 || echo "no .ko modules"

      - name: Upload NUKI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-NUKI-Genevn-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.lz4
            kernel-source/out/arch/arm64/boot/Image
            build.log
            kernel-source/out/.config
            modules/
          compression-level: 9
          overwrite: true

name: AnyRealm NUKI Colonel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch'
        default: 'android-14-release-u1tgns34.42-86-2-32'
        required: true

env:
  KERNEL_REPO: 015stray91/kernel-msm-1
  TOOLCHAIN_REPO: 015stray91/android-kernel-tools
  LADDER_REPO: 015stray91/clang-tools-static-binaries
  KOTO_REPO: 015stray91/Kotoamatsukami
  SB_REPO: 015stray91/Super-Builders

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone all repos
        run: |
          mkdir -p sources/{kernel,toolchain,ladder,koto,patches}
          cd sources
          
          git clone --depth=1 --branch ${{ inputs.kernel_branch }} \
            https://github.com/${{ env.KERNEL_REPO }}.git kernel
          
          git clone --depth=1 \
            https://github.com/${{ env.TOOLCHAIN_REPO }}.git toolchain
          
          git clone --depth=1 \
            https://github.com/${{ env.LADDER_REPO }}.git ladder
          
          git clone --depth=1 \
            https://github.com/${{ env.KOTO_REPO }}.git koto
          
          git clone --depth=1 --branch 015stray91 \
            https://github.com/${{ env.SB_REPO }}.git patches
          
          ls sources/

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-12 llvm-12 lld-12 gcc-aarch64-linux-gnu \
            libzstd-dev zstd lz4 liblz4-tool \
            bc libelf-dev libssl-dev ccache \
            kmod cpio zip unzip xz-utils

      - name: Setup paths (12 = baseline, 17 = expansion)
        run: |
          # Clang 12 (snapdragon) = inner compiler, KMI
          export PATH="$(pwd)/sources/toolchain/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/sources/toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin/aarch64-linux-gnu-"
          
          # Clang 17 (ladder) = outer, pre-processes/expands source
          export CLANG17="$(pwd)/sources/ladder/llvm-binaries/llvm-17/bin"
          export KOTO_SO="$(pwd)/sources/koto/colonel/build/Kotoamatsukami.so"
          
          echo "=== Ready ==="
          clang --version | head -1
          $CLANG17/clang --version 2>/dev/null | head -1 || echo "LLVM 17: need build"
          ls $KOTO_SO 2>/dev/null || echo "Koto.so: need build"

      - name: Expand source (Clang 17 → Clang 12)
        run: |
          export PATH="$(pwd)/sources/toolchain/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          export CLANG17="$(pwd)/sources/ladder/llvm-binaries/llvm-17/bin"
          export KOTO_SO="$(pwd)/sources/koto/colonel/build/Kotoamatsukami.so"
          cd sources/kernel
          
          echo "=== Expanding: SUSFS + ZeroMount + HybridMount + Colonel ==="
          for src in fs/susfs.c fs/zeromount.c \
                     fs/koto/sprof_eud.c fs/koto/sprof_proc.c \
                     fs/koto/sprof_env.c fs/koto/sprof_vfs.c \
                     fs/koto/sprof_profile.c; do
            [ -f "$src" ] || continue
            echo "  $src"
            $CLANG17/clang -S -emit-llvm "$src" -o "${src%.c}.ll" 2>/dev/null || continue
            $CLANG17/opt --load-pass-plugin="$KOTO_SO" "${src%.c}.ll" \
              --passes="flatten,bogus-control-flow,substitution,indirect-call" \
              -S -o "${src%.c}.ob.ll" 2>/dev/null || continue
            clang "${src%.c}.ob.ll" -S -o "${src%.c}.s" 2>/dev/null || continue
            mv "${src%.c}.s" "$src"
            rm -f "${src%.c}.ll" "${src%.c}.ob.ll"
          done

      - name: Apply patches
        run: |
          cd sources/kernel
          for p in ../patches/*.patch; do
            [ -f "$p" ] && patch -p1 -N < "$p" 2>/dev/null || true
          done

      - name: Configure
        run: |
          cd sources/kernel
          export PATH="$(pwd)/../toolchain/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/../toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin/aarch64-linux-gnu-"
          
          [ -f ../patches/configs/ksu-nh.defconfig ] && \
            cp ../patches/configs/ksu-nh.defconfig arch/arm64/configs/
          make ksu-nh.defconfig 2>/dev/null || make lineage_parrot_defconfig
          make olddefconfig

      - name: Build (Clang 12 compiles expanded source)
        run: |
          cd sources/kernel
          export PATH="$(pwd)/../toolchain/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/../toolchain/gcc/linux-x86/aarch64/gcc-linaro-7.5.0/bin/aarch64-linux-gnu-"
          export LLVM=1
          
          make -j$(nproc) Image.lz4 modules 2>&1 | tail -30

      - name: Package
        run: |
          mkdir -p artifacts
          [ -f sources/kernel/arch/arm64/boot/Image.lz4 ] && \
            cp sources/kernel/arch/arm64/boot/Image.lz4 artifacts/
          find sources/kernel -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nuki-colonel-kernel
          path: artifacts/

name: Build DarkMatter KSU-Next + NetHunter Kernel

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux 6.x kernel version from kernel.org'
        required: true
        default: '6.8.12'
        type: string
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Super-Builders
        uses: actions/checkout@v4
        with:
          repository: 015stray91/Super-Builders
          path: super-builders

      - name: Download Linux Kernel Source
        run: |
          VER="${{ inputs.kernel_version || '6.8.12' }}"
          curl -fL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VER}.tar.xz" -o linux.tar.xz
          tar -xf linux.tar.xz
          mv "linux-${VER}" kernel_src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev curl git cpio

      - name: Add KernelSU-Next
        working-directory: kernel_src
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          if ! grep -q "X86_FEATURE_INDIRECT_SAFE" arch/x86/include/asm/cpufeatures.h; then
            sed -i 's/!boot_cpu_has(X86_FEATURE_INDIRECT_SAFE)/0/g' drivers/kernelsu/core/init.c
            
      - name: Apply Super-Builders Patches
        working-directory: kernel_src
        run: |
          if [ -d "../super-builders/patches" ]; then
            for p in ../super-builders/patches/*.patch; do
              [ -e "$p" ] || continue
              echo "Applying $p..."
              git apply "$p" || patch -p1 < "$p" || true
            done
          fi

      - name: Configure Kernel (DarkMatter + KSU-Next + SUSFS + NetHunter + VivoBook Go)
        working-directory: kernel_src
        run: |
          if [ -f "arch/x86/configs/darkmatter_defconfig" ]; then
            make ARCH=x86_64 darkmatter_defconfig
          else
            make ARCH=x86_64 x86_64_defconfig
          fi

          cat >> .config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y.
          CONFIG_KSU_SUSFS=y
          CONFIG_ZEROMOUNT=y
          CONFIG_HYBRID_MOUNT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KERNEL_ZSTD=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_ZRAM=y
          CONFIG_ZSTD
          CONFIG_ZRAM_DEF_COMP_ZSTD=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_USB_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_BRIDGE=y
          CONFIG_TUN=y
          CONFIG_ASUS_WMI=y
          CONFIG_ASUS_NB_WMI=y
          CONFIG_DRM_AMDGPU=y
          CONFIG_DRM_I915=y
          CONFIG_NVME_CORE=y
          CONFIG_BLK_DEV_NVME=y
          CONFIG_I2C_HID_ACPI=y
          CONFIG_HID_MULTITOUCH=y
          CONFIG_PINCTRL_AMD=y
          CONFIG_RTW88=m
          CONFIG_RTW89=m
          CONFIG_MT7921E=m
          CONFIG_IWLWIFI=m
          CONFIG_BT_HCIBTUSB=m
          EOF

          make ARCH=x86_64 olddefconfig

      - name: Build bzImage & modules
        working-directory: kernel_src
        run: |
          make ARCH=x86_64 -j$(nproc) bzImage modules
          mkdir -p ../out/modules
          make ARCH=x86_64 INSTALL_MOD_PATH=../out/modules modules_install
          cp arch/x86/boot/bzImage ../out/kernel

      - name: Build kpatch_1
        run: |
          git clone --depth=1 https://github.com/015stray91/kpatch_1.git
          cd kpatch_1
          KVER=$(make -C ../kernel_src -s kernelrelease)
          make BUILD_KMOD=yes KVER="$KVER" || true
          mkdir -p ../out/kpatch
          cp -f kpatch/kpatch ../out/kpatch/ 2>/dev/null || true
          cp -f kmod/core/kpatch.ko ../out/kpatch/ 2>/dev/null || true

      - name: Upload Kernel & Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmatter-ksu-nh-kernel
          path: out/

name: Genevn Custom Toolchain Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_target:
        description: "Kernel target"
        type: choice
        default: "android12-5.10.209 (2024-05)"
        options:
          - "android12-5.10.209 (2024-05)"
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU
          - ReSukiSU
          - WKSU
        default: "KernelSU-Next"
      add_susfs:
        description: "Add SUSFS"
        type: boolean
        default: true

jobs:
  build:
    name: "Build Custom Kernel - Genevn"
    runs-on: ubuntu-latest
    
    steps:
      - name: Parse Target Details
        id: parse
        run: echo "codename=Genevn" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_tool_cache: true

      - uses: actions/checkout@v5

      - name: Initialize Toolchain Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu binutils bc bison flex libssl-dev libelf-dev cpio kmod python3

      - name: Compile Genevn Kernel
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          CODENAME: ${{ steps.parse.outputs.codename }}
        run: |
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out defconfig
          
          # We define the config as an environment variable for the make process
          # instead of trying to chain it with a backslash
          export CONFIG_KERNEL_LZ4=y
          make -j$(nproc --all) O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1
            - name: Package Kernel via AnyKernel3 Framework
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          
          if [ -f "kernel-source/out/arch/arm64/boot/Image.lz4" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.lz4 AnyKernel/Image
          else
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel/Image
          fi
          
          cd AnyKernel
          rm anykernel.sh
          # Use cat with a non-quoted delimiter to allow cleaner handling, 
          # but carefully escape the interior content if necessary.
          cat << 'END_SCRIPT' > anykernel.sh
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

### AnyKernel setup
# global properties
properties() {
  kernel.string=Genevn Next Kernel by Slm015
  do.devicecheck=1
  do.modules=0
  do.systemless=1
  do.cleanup=1
  do.cleanuponabort=0
  device.name1=genevn
  device.name2=genevn_g
  device.name3=
  device.name4=
  device.name5=
  supported.versions=
  supported.patchlevels=
  supported.vendorpatchlevels=
} # end properties

### AnyKernel install

# boot shell variables
BLOCK=boot;
IS_SLOT_DEVICE=1;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

# import functions/variables and setup patching
. tools/ak3-core.sh;

# boot install
split_boot;
flash_boot;
## end boot install

## init_boot files attributes
init_boot_attributes() {
  set_perm_recursive 0 0 755 644 $RAMDISK/*;
  set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
} # end attributes

# init_boot shell variables
BLOCK=init_boot;
IS_SLOT_DEVICE=1;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

# reset for init_boot patching
reset_ak;

# init_boot install
dump_boot;
write_boot;
## end init_boot install
END_SCRIPT

          chmod +x anykernel.sh
          zip -r9 ../Genevn-KernelSU-Next-Flashable.zip *
 

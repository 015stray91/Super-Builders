name: Genevn Custom Toolchain Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:[KernelSU-Next, SukiSU, ReSukiSU, WKSU]
        default: "KernelSU-Next"
      add_susfs:
        description: "Add SUSFS"
        type: boolean
        default: true
      add_zeromount:
        description: "Add ZeroMount"
        type: boolean
        default: true

jobs:
  build:
    name: "Build Custom Kernel - Genevn"
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_tool_cache: true

      - name: Checkout Super-Builders
        uses: actions/checkout@v5
        with:
          repository: 015stray91/Super-Builders
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu binutils bc bison flex libssl-dev libelf-dev cpio kmod python3 zip

      - name: Compile Genevn Kernel
        run: |
          # 1. Clone source and enter directory
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source
          
          # 2. KernelSU Setup
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # 3. Setup Tools and Build Path
          export KERNEL_DIR=$(pwd)
          export PATH=${KERNEL_DIR}/tools:$PATH
          
          # 4. Set Motorola GKI Build Variables
          export ARCH=arm64
          export VARIANT=gki
          export TARGET_PRODUCT=parrot_genevn
          export MSM_ARCH=parrot
          
          # 5. Build (Checking for standard build scripts)
          if [ -f "./build.sh" ]; then
            ./build.sh
          elif[ -f "./build_kernel.sh" ]; then
            ./build_kernel.sh
          else
            echo "--- No build script found, contents of root: ---"
            ls -F
            exit 1
          fi

      - name: Package Kernel via AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          
          # Copy binaries from GKI output directory
          cp kernel-source/out/android12-5.10/dist/Image.gz* AnyKernel/ 2>/dev/null || \
          cp kernel-source/out/dist/Image.gz* AnyKernel/ 2>/dev/null || \
          cp kernel-source/out/arch/arm64/boot/Image.gz* AnyKernel/ 2>/dev/null
          
          # Overwrite with your custom script
          cp .github/workflows/anykernel3/anykernel3.sh AnyKernel/anykernel.sh
          
          # Zip it up
          cd AnyKernel
          zip -r9 ../Genevn-KernelSU-Next-Flashable.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genevn-Next-Kernel-Signed
          path: Genevn-KernelSU-Next-Flashable.zip

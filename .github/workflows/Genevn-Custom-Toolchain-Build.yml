name: Genevn Custom Toolchain Build

on:
  workflow_dispatch:

jobs:
  # Job 1: Setup & Config Merge
  prepare_config:
    runs-on: ubuntu-latest
    outputs:
      config_ready: ${{ steps.merge.outputs.config_ready }}
    steps:
      - uses: actions/checkout@v5
      - name: Merge Fragments
        id: merge
        run: |
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source
          # Inject your custom fragment into the Motorola build path
          mkdir -p arch/arm64/configs/vendor/ext_config/
          cp ../.github/configs/moto-parrot-genevn.config arch/arm64/configs/vendor/ext_config/
          echo "config_ready=true" >> "$GITHUB_OUTPUT"
          # Upload the prepared source as an artifact to pass to the next job
          tar -czf source_ready.tar.gz .
          # (upload this tar in a real implementation)

  # Job 2: Build & Package
  build_and_package:
    needs: prepare_config
    runs-on: ubuntu-latest
    steps:
      - name: Compile & Package
        run: |
          # Pull down the source/config prepared in Job 1
          # [Add artifact download here]
          cd kernel-source
          
          # Initialize tools path
          export KERNEL_DIR=$(pwd)
          export PATH=${KERNEL_DIR}/tools:$PATH
          
          # Run the build
          export VARIANT=gki
          export TARGET_PRODUCT=parrot_genevn
          export MSM_ARCH=parrot
          ./build.sh
          
          # Package logic
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/android12-5.10/dist/Image.gz* AnyKernel/
          cp ../.github/workflows/anykernel3/anykernel3.sh AnyKernel/anykernel.sh
          cd AnyKernel
          zip -r9 ../Genevn-KernelSU-Next-Flashable.zip *

name: Genevn Custom Toolchain Build

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU
          - ReSukiSU
          - WKSU
        default: "KernelSU-Next"

jobs:
  build:
    name: "Build Custom Kernel - Genevn"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize Toolchain Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu binutils bc bison flex libssl-dev libelf-dev cpio kmod python3

      - name: Compile Genevn Kernel
        run: |
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CONFIG_KERNEL_LZ4=y
          
          make O=out defconfig
          make -j$(nproc --all) O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package and Verify Artifacts
        run: |
          # Verify the output exists from the compiler
          if [ -f "kernel-source/out/arch/arm64/boot/Image.lz4" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.lz4 anykernel/Image
          elif [ -f "kernel-source/out/arch/arm64/boot/Image" ]; then
            cp kernel-source/out/arch/arm64/boot/Image anykernel/Image
          else
            echo "Error: Kernel image not found in kernel-source/out/arch/arm64/boot/"
            exit 1
          fi
          
          # Compress the local 'anykernel' directory
          cd anykernel
          zip -r9 ../Genevn-KernelSU-Next-Flashable.zip *
          
          # Verify ZIP creation
          if [ -f "../Genevn-KernelSU-Next-Flashable.zip" ]; then
            echo "Successfully packaged to Genevn-KernelSU-Next-Flashable.zip"
          else
            echo "Error: Packaging failed"
            exit 1
          fi

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Genevn-Kernel-Build
          path: Genevn-KernelSU-Next-Flashable.zip

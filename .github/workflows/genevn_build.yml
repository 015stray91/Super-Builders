name: Genevn Build with YOUR ASOP Tools

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU
          - ReSukiSU
          - WKSU
        default: "KernelSU-Next"

jobs:
  build:
    name: "Build with YOUR tools"
    runs-on: ubuntu-22.04
    container: ghcr.io/lineageos4microg/android-kernel-build:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source

      # ===== PATCHING (same as before) =====
      - name: Apply KernelSU variant
        working-directory: kernel-source
        run: |
          case "${{ inputs.ksu_variant }}" in
            "KernelSU-Next")
              git remote add kernelsu https://github.com/tiann/KernelSU
              git fetch kernelsu next
              git am <(curl -sL https://raw.githubusercontent.com/tiann/KernelSU/next/patches/kernelsu.patch) || true
              git checkout kernelsu/next -- drivers/kernelsu/ include/kernelsu/
              ;;
            *)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_variant | lower }}"
              ;;
          esac

      - name: Apply SUFS + ZeroMount + KPM
        working-directory: kernel-source
        run: |
          git remote add sufs https://github.com/tiann/SUFS
          git fetch sufs main
          git am <(curl -sL https://raw.githubusercontent.com/tiann/SUFS/main/patch/kernel.patch) || true

          git remote add zeromount https://github.com/HuskyDG/ZeroMount
          git fetch zeromount main
          git am <(curl -sL https://raw.githubusercontent.com/HuskyDG/ZeroMount/main/patch/kernel.patch) || true

          git am <(curl -sL https://raw.githubusercontent.com/tiann/KernelSU/next/patches/kpm.patch) || true

      - name: Merge ACK
        working-directory: kernel-source
        run: |
          git remote add ack https://android.googlesource.com/kernel/common
          git fetch ack android12-5.10
          git merge ack/android12-5.10 --no-ff --no-commit -Xours
          git checkout --ours drivers/kernelsu/ drivers/gpu/msm/ drivers/platform/msm/
          git commit -m "ACK + mods"

      - name: Apply configs
        working-directory: kernel-source
        run: |
          make ARCH=arm64 genevn_gki_defconfig
          scripts/kconfig/merge_config.sh arch/arm64/configs/vendor/msm-genevn.config
          cat > full_mods.config <<'EOF'
          CONFIG_KERNELSU=y
          CONFIG_KERNELSU_ENABLE_BY_DEFAULT=y
          CONFIG_SUFS=y
          CONFIG_SUFS_ZSTD=y
          CONFIG_ZERO_MOUNT=y
          CONFIG_KPM=y
          EOF
          scripts/kconfig/merge_config.sh full_mods.config
          make olddefconfig

      - name: Build kernel
        working-directory: kernel-source
        run: |
          make -j$(nproc) ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTB:=msm/sdm435-genevn.dtb \
            Image.gz-dtb

      # ===== USE YOUR TOOLS =====
      - name: Package with YOUR mkbootimg.py
        run: |
          # Paths to YOUR files
          KERNEL="kernel-source/arch/arm64/boot/Image.gz-dtb"
          RAMDISK="kernel-source/packages/ASOP-tools/mkbootimg/boot/ramdisk"
          CMDLINE=$(cat kernel-source/packages/ASOP-tools/mkbootimg/boot/extract_your_boot_info)
          OUT_DIR="output"

          mkdir -p "$OUT_DIR"

          # Use YOUR Python script
          python3 kernel-source/packages/ASOP-tools/mkbootimg.py \
            --kernel "$KERNEL" \
            --ramdisk "$RAMDISK" \
            --cmdline "$CMDLINE" \
            --base 0x80000000 \
            --pagesize 4096 \
            --output "$OUT_DIR/Genevn-KernelSU-${{ inputs.ksu_variant }}-boot.img"

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Genevn-Kernel-${{ inputs.ksu_variant }}
          path: output/

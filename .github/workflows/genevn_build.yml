name: Genevn Custom Toolchain Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_target:
        description: "Kernel target"
        type: choice
        default: "android12-5.10.218 (2024-05)"
        options:
          - "android12-5.10.218 (2024-05)"
      quick_target:
        description: "Quick select"
        type: string
        default: ""
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU
          - ReSukiSU
          - WKSU
        default: "KernelSU-Next"
      add_susfs:
        description: "Add SUSFS"
        type: boolean
        default: true
      add_zeromount:
        description: "Add ZeroMount"
        type: boolean
        default: true
      add_zram:
        description: "Add ZRAM with LZ4K"
        type: boolean
        default: true
      add_bbg:
        description: "Add Baseband Guard"
        type: boolean
        default: true
      add_overlayfs_support:
        description: "Add overlayfs support"
        type: boolean
        default: true
      add_kpm:
        description: "Add KPM"
        type: boolean
        default: true
      sukisu_commit:
        description: "KSU commit override"
        type: string
        default: ""

jobs:
  build:
    name: "Build Custom Kernel - Genevn"
    runs-on: ubuntu-22.04
    
    steps:
      - name: Parse Target Details
        id: parse
        run: |
          echo "android_version=android12" >> "$GITHUB_OUTPUT"
          echo "kernel_version=5.10" >> "$GITHUB_OUTPUT"
          echo "sub_level=218" >> "$GITHUB_OUTPUT"
          echo "os_patch_level=2024-05" >> "$GITHUB_OUTPUT"
          echo "codename=Genevn" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_tool_cache: true

      - uses: actions/checkout@v5

      - name: Initialize Toolchain Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu binutils bc bison flex libssl-dev libelf-dev cpio kmod python3 libncurses-dev libtinfo-dev

      - name: Compile Genevn Kernel
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          ADD_SUSFS: ${{ inputs.add_susfs }}
          ADD_ZEROMOUNT: ${{ inputs.add_zeromount }}
          ADD_ZRAM: ${{ inputs.add_zram }}
          ADD_BBG: ${{ inputs.add_bbg }}
          ADD_OVERLAYFS: ${{ inputs.add_overlayfs_support }}
          ADD_KPM: ${{ inputs.add_kpm }}
          SUKISU_COMMIT: ${{ inputs.sukisu_commit }}
          CODENAME: ${{ steps.parse.outputs.codename }}
        run: |
          # 1. Clone Source
          git clone --depth=1 https://github.com/015stray91/kernel-msm-1.git kernel-source
          cd kernel-source
          
          # 2. Merge ACK
          git remote add ack https://android.googlesource.com/kernel/common
          git fetch ack android12-5.10
          git merge ack/android12-5.10 --no-ff --no-commit -Xours
          
          # 3. KSU Setup
          if [ "$KSU_VARIANT" != "None" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            if [ ! -z "$SUKISU_COMMIT" ]; then
              cd KernelSU && git checkout "$SUKISU_COMMIT" && cd ..
            fi
          fi
          
          # 4. Apply Features (defconfig patching)
          [ "$ADD_ZRAM" = "true" ] && echo -e "CONFIG_ZRAM=y\nCONFIG_ZCOMP_LZ4K=y" >> arch/arm64/configs/msm_defconfig
          [ "$ADD_OVERLAYFS" = "true" ] && echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/msm_defconfig
          
          # 5. Build
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out msm_defconfig
          make -j$(nproc --all) O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LLVM=1 LLVM_IAS=1

      - name: Package Boot Image
        run: |
          python3 kernel-source/package/asop-tools/repack_bootimg.py \
            --kernel "kernel-source/out/arch/arm64/boot/Image.gz-" \
            --ramdisk "kernel-source/package/asop-tools/mkbootimg/boot/ramdisk" \
            --base 0x80000000 \
            --pagesize 4096 \
            --output "output/Genevn-KernelSU-${{ inputs.ksu_variant }}-boot.img"

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Genevn-Kernel-${{ inputs.ksu_variant }}
          path: output/
